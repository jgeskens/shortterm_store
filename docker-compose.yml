x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    build: .
    logging: *logging
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: postgres://shorttermstore:${POSTGRES_PASSWORD:-shorttermstore}@db:5432/shorttermstore
      STORAGE_ROOT: /storage
    volumes:
      - ${STORAGE_DIR:-./storage}:/storage
    ports:
      - "127.0.0.1:${APP_PORT:-8400}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: shorttermstore
      POSTGRES_USER: shorttermstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shorttermstore}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorttermstore -d shorttermstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  cron:
    build: .
    logging: *logging
    restart: unless-stopped
    # First run after 5 minutes, so the app has applied migrations on a fresh database.
    command: ["sh", "-c", "sleep 300; while true; do python manage.py cleanup_empty_stores; sleep 86400; done"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgres://shorttermstore:${POSTGRES_PASSWORD:-shorttermstore}@db:5432/shorttermstore
      STORAGE_ROOT: /storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
