<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ item.display_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
    <script>
        // Apply the stored theme before first paint so dark mode doesn't flash.
        (function () {
            var mode = 'auto';
            try { mode = localStorage.getItem('darkMode') || 'auto'; } catch (e) {}
            if (mode === 'on') document.documentElement.setAttribute('data-theme', 'dark');
            else if (mode === 'off') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <style>
        :root {
            --bg: #f4f3ef;
            --paper: #fbfaf7;
            --ink: #161614;
            --ink-2: #5d5c57;
            --ink-3: #9a988f;
            --line: #e1dfd7;
            --line-strong: #c4c1b6;
            --grid: rgba(22, 22, 20, 0.045);
            --signal: #e0531f;
            --signal-ink: #ffffff;
            --signal-wash: rgba(224, 83, 31, 0.08);
            --danger: #c2321f;
            --ok: #2f8a5b;
            --serif: 'Instrument Serif', 'Times New Roman', serif;
            --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
            --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
            --cell: 12px 16px;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0e0e0d;
                --paper: #151514;
                --ink: #ecebe6;
                --ink-2: #a3a199;
                --ink-3: #6b6a64;
                --line: #2a2a27;
                --line-strong: #43423e;
                --grid: rgba(236, 235, 230, 0.04);
                --signal: #ff7240;
                --signal-ink: #160a05;
                --signal-wash: rgba(255, 114, 64, 0.1);
                --danger: #ff6b57;
                --ok: #5fc48f;
                color-scheme: dark;
            }
        }
        :root[data-theme="dark"] {
            --bg: #0e0e0d;
            --paper: #151514;
            --ink: #ecebe6;
            --ink-2: #a3a199;
            --ink-3: #6b6a64;
            --line: #2a2a27;
            --line-strong: #43423e;
            --grid: rgba(236, 235, 230, 0.04);
            --signal: #ff7240;
            --signal-ink: #160a05;
            --signal-wash: rgba(255, 114, 64, 0.1);
            --danger: #ff6b57;
            --ok: #5fc48f;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            padding: 28px;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.6 var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        [v-cloak] { display: none; }
        button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
        :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
        .mono { font-family: var(--mono); }
        .label {
            font: 500 10.5px/1.4 var(--mono);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-3);
        }
        .icon { width: 16px; height: 16px; flex: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* Frame: one hairline box with + ticks on its corners */
        .frame {
            position: relative;
            max-width: 1320px;
            margin: 0 auto;
            border: 1px solid var(--line-strong);
            background: var(--paper);
        }
        .tick { position: absolute; width: 11px; height: 11px; color: var(--ink-3); pointer-events: none; }
        .tick.tl { left: -6px; top: -6px; } .tick.tr { right: -6px; top: -6px; }
        .tick.bl { left: -6px; bottom: -6px; } .tick.br { right: -6px; bottom: -6px; }

        /* Header */
        .head {
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.2fr) auto;
            border-bottom: 1px solid var(--line-strong);
        }
        .head > div { padding: var(--cell); border-right: 1px solid var(--line); min-width: 0; }
        .head > div:last-child { border-right: 0; }
        .title-input {
            display: block;
            width: 100%;
            margin: 2px 0 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--ink);
            font: 34px/1.1 var(--serif);
            letter-spacing: -0.01em;
            text-overflow: ellipsis;
        }
        .title-input::placeholder { color: var(--ink-3); }
        .title-input:focus { outline: none; }
        .title-cell:focus-within .label { color: var(--signal); }

        .link-cell { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .link-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .link {
            font: 13px/1.3 var(--mono);
            color: var(--ink);
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .link b { font-weight: 500; }
        .link:hover { text-decoration: underline; text-underline-offset: 3px; }
        .countdown {
            font: 500 11px/1 var(--mono);
            padding: 4px 6px;
            background: var(--signal);
            color: var(--signal-ink);
            font-variant-numeric: tabular-nums;
        }
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border: 1px solid transparent;
            color: var(--ink-2);
            flex: none;
        }
        .icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
        .icon-btn.on { color: var(--signal); }
        .copy-btn { margin-left: auto; }

        .ctrl-cell { display: flex; align-items: center; gap: 14px; }
        .seg { display: flex; }
        .seg button {
            font: 500 11px/1 var(--mono);
            letter-spacing: 0.06em;
            padding: 8px 10px;
            border: 1px solid var(--line-strong);
            margin-left: -1px;
            color: var(--ink-2);
        }
        .seg button:first-child { margin-left: 0; }
        .seg button:hover { color: var(--ink); }
        .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); position: relative; }
        .ctrl-icons { display: flex; gap: 2px; }

        /* Workspace on a 24px grid */
        .work {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            min-height: 46vh;
            background-color: var(--paper);
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: -1px -1px;
        }
        .work.single { grid-template-columns: minmax(0, 1fr); }
        .pane { position: relative; min-width: 0; padding: 22px 24px 28px; }
        .pane + .pane { border-left: 1px solid var(--line-strong); }
        .pane-label { position: absolute; top: 8px; right: 12px; }
        .editor {
            display: block;
            width: 100%;
            min-height: 40vh;
            padding: 0;
            border: 0;
            resize: none;
            overflow: hidden;
            background: transparent;
            color: var(--ink);
            font: 14px/24px var(--mono);
            caret-color: var(--signal);
        }
        .editor:focus { outline: none; }
        .editor::placeholder { color: var(--ink-3); }
        .hints { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; }
        .hints span { display: inline-flex; gap: 6px; align-items: center; }
        kbd {
            font: 500 10.5px/1 var(--mono);
            padding: 3px 5px;
            border: 1px solid var(--line-strong);
            border-bottom-width: 2px;
            color: var(--ink-2);
        }

        /* Rendered markdown */
        .md { font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
        .md > :first-child { margin-top: 0; }
        .md h1, .md h2, .md h3 { font-family: var(--serif); font-weight: 400; line-height: 1.15; margin: 1.2em 0 0.4em; }
        .md h1 { font-size: 34px; } .md h2 { font-size: 26px; } .md h3 { font-size: 21px; }
        .md h4, .md h5, .md h6 { font-size: 13px; font-weight: 500; margin: 1.2em 0 0.4em; }
        .md a { color: var(--signal); text-underline-offset: 3px; }
        .md img { max-width: 100%; cursor: zoom-in; border: 1px solid var(--line); }
        .md code { font: 13px var(--mono); background: var(--signal-wash); padding: 1px 4px; }
        .md pre { background: var(--bg); border: 1px solid var(--line); padding: 12px 14px; overflow: auto; }
        .md pre code { background: none; padding: 0; }
        .md blockquote { margin: 0; padding-left: 14px; border-left: 2px solid var(--signal); color: var(--ink-2); }
        .md hr { border: 0; border-top: 1px solid var(--line-strong); }
        .md table { border-collapse: collapse; width: 100%; margin: 0 0 1rem; font-size: 13px; }
        .md th, .md td { border: 1px solid var(--line-strong); padding: 6px 10px; text-align: left; }
        .md th { font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); background: var(--bg); }
        .empty-read { color: var(--ink-3); font-family: var(--serif); font-size: 22px; }

        /* Locked */
        .locked { display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
        .unlock { width: min(360px, 100%); border: 1px solid var(--line-strong); background: var(--paper); }
        .unlock > * { padding: 14px 16px; }
        .unlock > * + * { border-top: 1px solid var(--line); }
        .unlock h2 { margin: 4px 0 0; font: 28px/1.1 var(--serif); font-weight: 400; }

        /* Fields and buttons */
        .field {
            display: block;
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--line-strong);
            background: var(--paper);
            color: var(--ink);
            font: 14px var(--mono);
        }
        .field:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px var(--signal-wash); }
        .btn {
            font: 500 11px/1 var(--mono);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 10px 12px;
            border: 1px solid var(--line-strong);
        }
        .btn:hover { border-color: var(--ink); }
        .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
        .btn.danger { color: var(--danger); }
        .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
        .error-text { color: var(--danger); font: 12px var(--mono); margin: 8px 0 0; }

        /* Files */
        .files-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            border-top: 1px solid var(--line-strong);
            border-bottom: 1px solid var(--line);
        }
        .files {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        }
        .files > * { box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
        .file { position: relative; background: var(--paper); padding: 10px; min-width: 0; }
        .thumb {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            aspect-ratio: 4 / 3;
            border: 1px solid var(--line);
            background: var(--bg);
            overflow: hidden;
            color: var(--ink-2);
        }
        button.thumb:hover { border-color: var(--line-strong); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.25s ease; }
        .file:hover .thumb img { transform: scale(1.03); }
        .ext { font: 500 18px var(--mono); letter-spacing: 0.04em; color: var(--ink-2); }
        .play {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--line-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
        }
        .file.playing .play { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
        .audio-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--line); }
        .audio-bar i { display: block; height: 100%; background: var(--signal); }
        .thumb.audio { position: relative; }
        .meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
        .meta a {
            font: 12px/1.4 var(--mono);
            color: var(--ink);
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .meta a:hover { text-decoration: underline; text-underline-offset: 3px; }
        .meta .label { flex: none; }
        .del {
            position: absolute;
            top: 14px;
            right: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 26px;
            padding: 0 6px;
            background: var(--paper);
            border: 1px solid var(--line-strong);
            color: var(--ink-2);
            opacity: 0;
            transition: opacity 0.12s;
        }
        .file:hover .del, .file:focus-within .del, .del.confirm { opacity: 1; }
        .del:hover, .del.confirm { color: var(--danger); border-color: var(--danger); }
        .del.confirm { font: 500 10.5px var(--mono); letter-spacing: 0.06em; }
        @media (hover: none) { .del { opacity: 1; } }
        .add {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 150px;
            background: var(--paper);
            color: var(--ink-2);
            outline: 1px dashed var(--line-strong);
            outline-offset: -10px;
        }
        .add:hover { color: var(--signal); outline-color: var(--signal); }

        /* Status bar */
        .status {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            padding: 7px 16px;
            border-top: 1px solid var(--line-strong);
        }
        .status > :last-child { text-align: right; }
        .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 7px; vertical-align: 1px; }
        .dot.busy { background: var(--signal); animation: pulse 1s ease-in-out infinite; }
        .dot.err { background: var(--danger); }
        @keyframes pulse { 50% { opacity: 0.3; } }
        .progress { display: flex; align-items: center; gap: 8px; }
        .progress .bar { width: 120px; height: 2px; background: var(--line); }
        .progress .bar i { display: block; height: 100%; background: var(--signal); transition: width 0.15s; }

        /* Drop overlay */
        .drop {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            pointer-events: none;
        }
        .drop div {
            width: min(520px, calc(100% - 32px));
            padding: 56px 24px;
            text-align: center;
            border: 1.5px dashed var(--signal);
            background: var(--signal-wash);
            color: var(--signal);
            font: 500 12px var(--mono);
            letter-spacing: 0.1em;
        }

        /* Dialogs */
        dialog { padding: 0; border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); }
        dialog::backdrop { background: rgba(10, 10, 9, 0.45); }
        .pw-dialog { width: min(380px, calc(100% - 32px)); }
        .pw-dialog > * { padding: 14px 16px; }
        .pw-dialog > * + * { border-top: 1px solid var(--line); }
        .pw-dialog h2 { margin: 4px 0 0; font: 28px/1.1 var(--serif); font-weight: 400; }
        .lightbox {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            border: 0;
            background: #0b0b0a;
            color: #ecebe6;
        }
        .lightbox::backdrop { background: #0b0b0a; }
        .lb-stage { position: absolute; inset: 52px 0 0; display: flex; align-items: center; justify-content: center; overflow: auto; }
        .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; transition: transform 0.25s ease; }
        .lb-stage img.zoomed { transform: scale(2.2); cursor: zoom-out; }
        .lb-bar {
            position: absolute;
            inset: 0 0 auto;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px 0 16px;
            border-bottom: 1px solid #2a2a27;
            font: 12px var(--mono);
            color: #a3a199;
        }
        .lb-bar .name { color: #ecebe6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lb-bar .spacer { flex: 1; }
        .lb-bar .icon-btn { color: #ecebe6; }
        .lb-bar .icon-btn:hover { border-color: #43423e; }
        .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 1px solid #43423e; background: rgba(11, 11, 10, 0.6); color: #ecebe6; display: flex; align-items: center; justify-content: center; }
        .lb-nav:hover { border-color: #ecebe6; }
        .lb-nav.prev { left: 16px; } .lb-nav.next { right: 16px; }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 60;
            padding: 9px 14px;
            background: var(--ink);
            color: var(--paper);
            font: 500 11px var(--mono);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .toast.err { background: var(--danger); color: #fff; }

        @media (max-width: 880px) {
            body { padding: 16px; }
            .head { grid-template-columns: minmax(0, 1fr); }
            .head > div { border-right: 0; border-bottom: 1px solid var(--line); }
            .head > div:last-child { border-bottom: 0; }
            .ctrl-cell { justify-content: space-between; }
            .title-input { font-size: 30px; }
            .work { grid-template-columns: minmax(0, 1fr); }
            .pane + .pane { border-left: 0; border-top: 1px solid var(--line-strong); }
            .pane { padding: 18px 16px 22px; }
            .editor { min-height: 30vh; }
            .files { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .status { grid-template-columns: 1fr auto; }
            .status > :last-child { display: none; }
        }
    </style>
</head>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="i-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5.5" y="5.5" width="8" height="8"/><path d="M10.5 3V2.5h-8v8H3"/></symbol>

        <symbol id="i-unlock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="7" width="10" height="7"/><path d="M5.5 7V5a2.5 2.5 0 014.8-1"/></symbol>

        <symbol id="i-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></symbol>

        <symbol id="i-plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 2v12M2 8h12"/></symbol>

    </defs>
</svg>

<div id="app" v-cloak>
    <main class="frame"
          @dragenter.prevent="onDragEnter"
          @dragover.prevent
          @dragleave="onDragLeave"
          @drop.prevent="onDrop">
        <svg class="tick tl"><use href="#i-tick"/></svg>
        <svg class="tick tr"><use href="#i-tick"/></svg>
        <svg class="tick bl"><use href="#i-tick"/></svg>
        <svg class="tick br"><use href="#i-tick"/></svg>

        <header class="head">
            <div class="title-cell">
                <label class="label" for="title" v-text="'Store / ' + storeLabel"></label>
                <input id="title" class="title-input" v-model="name" placeholder="Untitled store"
                       :readonly="locked" autocomplete="off" spellcheck="false"
                       @focus="editingTitle = true" @blur="saveTitle" @keydown.enter="$event.target.blur()">
            </div>

            <div class="link-cell">
                <div class="link-row">
                    <a class="link" :href="shareUrl" @click.prevent="copyLink">
                        <template v-if="countdown"><span v-text="host + '/'"></span><b v-text="shortcut"></b></template>
                        <span v-else v-text="fullUrl"></span>
                    </a>
                    <span v-if="countdown" class="countdown" title="Short link expires" v-text="countdown"></span>
                    <button class="icon-btn copy-btn" :class="{on: copied}" @click="copyLink" :aria-label="copied ? 'Copied' : 'Copy link'">
                        <svg class="icon"><use :href="copied ? '#i-check' : '#i-copy'"/></svg>
                    </button>
                </div>
                <div class="label" v-text="linkCaption"></div>
            </div>

            <div class="ctrl-cell">
                <div class="seg" role="group" aria-label="Mode">
                    <button v-for="m in modes" :key="m.value" :aria-pressed="mode === m.value" :disabled="locked"
                            @click="setMode(m.value)" :title="m.title" v-text="m.label"></button>
                </div>
                <div class="ctrl-icons">
                    <button class="icon-btn" :class="{on: hasPassword}" @click="openPasswordDialog" :disabled="locked"
                            :aria-label="hasPassword ? 'Change password' : 'Set password'" :title="hasPassword ? 'Password set' : 'No password'">
                        <svg class="icon"><use :href="hasPassword ? '#i-lock' : '#i-unlock'"/></svg>
                    </button>
                    <button class="icon-btn" @click="cycleTheme" :aria-label="'Theme: ' + themeLabel" :title="'Theme: ' + themeLabel">
                        <svg class="icon"><use :href="themeIcon"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <section v-if="locked" class="work single">
            <div class="locked">
                <form class="unlock" @submit.prevent="verifyPassword">
                    <div><span class="label">Locked</span><h2>Enter the password</h2></div>
                    <div>
                        <label class="sr-only" for="unlock-pw">Password</label>
                        <input id="unlock-pw" class="field" type="password" v-model="inputPassword" autofocus autocomplete="current-password" @input="unlockError = ''">
                        <p v-if="unlockError" class="error-text" v-text="unlockError"></p>
                    </div>
                    <div class="btn-row"><button class="btn primary" type="submit">Unlock</button></div>
                </form>
            </div>
        </section>

        <section v-else class="work" :class="{single: mode !== 'editor'}">
            <div class="pane" v-if="mode === 'simple' || mode === 'editor'">
                <span class="label pane-label" v-if="mode === 'editor'">Source</span>
                <label class="sr-only" for="editor">Text</label>
                <textarea id="editor" ref="editor" class="editor" v-model="text" spellcheck="false"
                          placeholder="Start typing. Everything saves as you go."
                          @input="onTextInput" @keyup="handleKeyup" @paste="handlePaste"></textarea>
                <div class="hints label" v-if="!text">
                    <span><kbd>=</kbd> after a sum calculates it</span>
                    <span><kbd>⌘V</kbd> an image to upload it</span>
                    <span>Drop files anywhere</span>
                </div>
            </div>
            <div class="pane" v-if="mode === 'editor' || mode === 'reader'" @click="onPreviewClick">
                <span class="label pane-label" v-if="mode === 'editor'">Preview</span>
                <div v-if="text" class="md" v-html="renderedMarkdown"></div>
                <div v-else class="empty-read">Nothing written yet.</div>
            </div>
        </section>

        <template v-if="!locked">
            <div class="files-head">
                <span class="label">Files</span>
                <span class="label" v-text="uploads.length + (uploads.length === 1 ? ' file' : ' files')"></span>
            </div>
            <div class="files">
                <div v-for="u in uploads" :key="u.guid" class="file" :class="{playing: audio.guid === u.guid && audio.playing}">
                    <button v-if="u.is_image" class="thumb" @click="openLightbox(u.url)" :aria-label="'View ' + u.filename">
                        <img :src="u.url" alt="" loading="lazy">
                    </button>
                    <div v-else-if="u.is_audio" class="thumb audio">
                        <button class="play" @click="toggleAudio(u)" :aria-label="(audio.guid === u.guid && audio.playing ? 'Pause ' : 'Play ') + u.filename">
                            <svg class="icon"><use :href="audio.guid === u.guid && audio.playing ? '#i-pause' : '#i-play'"/></svg>
                        </button>
                        <div class="audio-bar" v-if="audio.guid === u.guid"><i :style="{width: audio.progress + '%'}"></i></div>
                    </div>
                    <a v-else class="thumb" :href="u.url" :aria-label="'Open ' + u.filename">
                        <span class="ext" v-text="extension(u.filename)"></span>
                    </a>
                    <div class="meta">
                        <a :href="u.url" v-text="u.filename" :title="u.filename"></a>
                        <span class="label" v-text="relativeTime(u.modified)" :title="formatDate(u.modified)"></span>
                    </div>
                    <button class="del" :class="{confirm: confirmDelete === u.guid}" @click="deleteUpload(u)"
                            :aria-label="confirmDelete === u.guid ? 'Confirm delete ' + u.filename : 'Delete ' + u.filename">
                        <svg class="icon"><use href="#i-trash"/></svg>
                        <span v-if="confirmDelete === u.guid">DELETE?</span>
                    </button>
                </div>
                <button class="add" @click="$refs.fileInput.click()">
                    <svg class="icon"><use href="#i-plus"/></svg>
                    <span class="label" style="color: inherit">Add or drop files</span>
                </button>
            </div>
            <input ref="fileInput" type="file" multiple hidden @change="onFilesPicked">
        </template>

        <footer class="status label">
            <span>
                <i class="dot" :class="{busy: saveState === 'saving' || saveState === 'pending', err: saveState === 'error'}"></i>
                <span v-text="saveLabel"></span>
            </span>
            <span v-if="upload.active" class="progress">
                <span v-text="'Uploading ' + (upload.done + 1) + '/' + upload.count"></span>
                <span class="bar"><i :style="{width: uploadPercent + '%'}"></i></span>
                <span v-text="uploadPercent + '%'"></span>
            </span>
            <span v-else v-text="syncNote"></span>
            <span>Empty stores are cleared daily</span>
        </footer>
    </main>

    <div v-if="dragging" class="drop"><div>DROP TO UPLOAD</div></div>

    <dialog ref="pwDialog" class="pw-dialog" @close="newPassword = ''">
        <form method="dialog" @submit.prevent="setPassword(newPassword)">
            <div><span class="label" v-text="hasPassword ? 'Password set' : 'No password'"></span><h2 v-text="hasPassword ? 'Change password' : 'Set a password'"></h2></div>
            <div>
                <label class="sr-only" for="new-pw">New password</label>
                <input id="new-pw" class="field" type="password" v-model="newPassword" placeholder="New password" autocomplete="new-password">
            </div>
            <div class="btn-row">
                <button v-if="hasPassword" class="btn danger" type="button" @click="setPassword('')" style="margin-right: auto">Remove</button>
                <button class="btn" type="button" @click="$refs.pwDialog.close()">Cancel</button>
                <button class="btn primary" type="submit">Set</button>
            </div>
        </form>
    </dialog>

    <dialog ref="lightbox" class="lightbox" @close="lightbox.open = false" @keydown.left="stepLightbox(-1)" @keydown.right="stepLightbox(1)">
        <template v-if="lightbox.open">
            <div class="lb-bar">
                <span v-if="images.length > 1 && lightboxIndex !== -1" v-text="(lightboxIndex + 1) + ' / ' + images.length"></span>
                <span class="name" v-text="lightboxName"></span>
                <span class="spacer"></span>
                <a class="icon-btn" :href="lightbox.url" target="_blank" rel="noopener" aria-label="Open original"><svg class="icon"><use href="#i-right"/></svg></a>
                <button class="icon-btn" @click="$refs.lightbox.close()" aria-label="Close" autofocus><svg class="icon"><use href="#i-close"/></svg></button>
            </div>
            <div class="lb-stage">
                <img :src="lightbox.url" :class="{zoomed: lightbox.zoomed}" @click="lightbox.zoomed = !lightbox.zoomed" alt="">
            </div>
            <template v-if="images.length > 1 && lightboxIndex !== -1">
                <button class="lb-nav prev" @click="stepLightbox(-1)" aria-label="Previous image"><svg class="icon"><use href="#i-left"/></svg></button>
                <button class="lb-nav next" @click="stepLightbox(1)" aria-label="Next image"><svg class="icon"><use href="#i-right"/></svg></button>
            </template>
        </template>
    </dialog>

    <div v-if="toast.text" class="toast" :class="{err: toast.error}" role="status" v-text="toast.text"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.13/dist/vue.global.prod.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.19/marked.min.js"
        integrity="sha512-CPGsmz+2yVpGnri/iBEoPVrRHiPaHQ3gzuSCfmfnZ2KKF/GKMvW8S7uVFRbZD0uOVMaNYY4HCATeCShxZWgp6w=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.0/purify.min.js"
        integrity="sha512-/hVAZO5POxCKdZMSLefw30xEVwjm94PAV9ynjskGbIpBvHO9EBplEcdUlBdCKutpZsF+La8Ag4gNrG0gAOn3Ig=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/expr-eval/0.10.0/bundle.min.js"
        integrity="sha512-+igwJj4NcCpguyr7R2azSh5Hl3qOsOKo1WAFbDCxXAPoxLqqgHE3zpU/twAxGsrQrC3Q6hnLurBDbYHYLD9SpQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
    const ITEM_GUID = '{{ item.guid }}';
    const ITEM_PATH = '{{ request.path }}';
    const CSRF_TOKEN = '{{ csrf_token }}';
    const PASSWORD_KEY = 'password-' + ITEM_GUID;

    function storageGet(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function storageSet(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
    }
    function storageRemove(key) {
        try { localStorage.removeItem(key); } catch (e) {}
    }

    function itemHeaders(extra) {
        const headers = Object.assign({'X-CSRFToken': CSRF_TOKEN}, extra || {});
        const storedPassword = storageGet(PASSWORD_KEY);
        if (storedPassword) {
            headers['X-Item-Password'] = storedPassword;
        }
        return headers;
    }

    function postJson(url, data) {
        return fetch(url, {
            method: 'POST',
            headers: itemHeaders({'Content-Type': 'application/json'}),
            body: JSON.stringify(data)
        });
    }

    // XHR rather than fetch: fetch can't report upload progress.
    function postWithProgress(url, formData, onProgress) {
        return new Promise(function (resolve, reject) {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', url);
            xhr.upload.onprogress = function (event) {
                if (event.lengthComputable) onProgress(event.loaded);
            };
            xhr.onload = function () {
                if (xhr.status >= 200 && xhr.status < 300) resolve();
                else reject(new Error('Upload failed (' + xhr.status + ')'));
            };
            xhr.onerror = function () { reject(new Error('Upload failed')); };
            xhr.send(formData);
        });
    }

    const app = Vue.createApp({
        delimiters: ['[[', ']]'],
        data() {
            return {
                name: '',
                displayName: '',
                text: '',
                mode: 'simple',
                modes: [
                    {label: 'TXT', value: 'simple', title: 'Plain text'},
                    {label: 'SPLIT', value: 'editor', title: 'Markdown with preview'},
                    {label: 'READ', value: 'reader', title: 'Rendered markdown'}
                ],
                uploads: [],
                dataLoaded: false,
                inDb: false,
                locked: false,
                hasPassword: false,
                shortcut: '',
                shortLinkExpiresAt: null,
                passwordToken: '',
                inputPassword: '',
                unlockError: '',
                newPassword: '',
                editingTitle: false,
                preventUpdates: false,
                changeTimeout: null,
                editRevision: 0,
                pendingSaves: 0,
                saveState: 'saved',
                syncNote: '',
                syncNoteTimeout: null,
                clock: Date.now(),
                copied: false,
                theme: storageGet('darkMode') || 'auto',
                upload: {active: false, count: 0, done: 0, loaded: 0, total: 0},
                dragDepth: 0,
                lightbox: {open: false, url: null, zoomed: false},
                audio: {guid: null, playing: false, progress: 0},
                confirmDelete: null,
                confirmDeleteTimeout: null,
                toast: {text: '', error: false},
                toastTimeout: null
            };
        },
        created() {
            this.player = new Audio();
            this.player.preload = 'auto';
            this.player.addEventListener('timeupdate', () => {
                if (this.player.duration) this.audio.progress = this.player.currentTime / this.player.duration * 100;
            });
            this.player.addEventListener('play', () => { this.audio.playing = true; });
            this.player.addEventListener('pause', () => { this.audio.playing = false; });
            this.player.addEventListener('ended', () => this.playNextAudio());

            this.update();
            setInterval(() => this.update(), 3000);
            setInterval(() => { this.clock = Date.now(); }, 1000);
            window.addEventListener('beforeunload', (event) => {
                if (this.saveState === 'pending' || this.saveState === 'saving' || this.upload.active) {
                    event.preventDefault();
                    event.returnValue = '';
                }
            });
        },
        computed: {
            storeLabel() {
                return ITEM_GUID.slice(0, 4).toUpperCase();
            },
            host() {
                return window.location.host;
            },
            fullUrl() {
                return window.location.host + ITEM_PATH;
            },
            countdown() {
                if (!this.inDb || !this.shortcut || !this.shortLinkExpiresAt) return null;
                const remaining = Math.floor((new Date(this.shortLinkExpiresAt).getTime() - this.clock) / 1000);
                if (remaining <= 0) return null;
                const minutes = Math.floor(remaining / 60);
                const seconds = remaining % 60;
                return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            },
            shareUrl() {
                return this.countdown ? '/' + this.shortcut + '/' : ITEM_PATH;
            },
            linkCaption() {
                if (this.copied) return 'Copied to clipboard';
                if (this.locked) return 'Password protected';
                if (this.countdown) return 'Short link runs out, the full link stays';
                if (!this.inDb) return 'Start typing to get a short link';
                return 'Anyone with this link can open the store';
            },
            themeLabel() {
                return {auto: 'system', on: 'dark', off: 'light'}[this.theme] || 'system';
            },
            themeIcon() {
                return {auto: '#i-auto', on: '#i-moon', off: '#i-sun'}[this.theme] || '#i-auto';
            },
            saveLabel() {
                if (!this.dataLoaded) return 'Loading…';
                if (this.locked) return 'Locked';
                return {
                    pending: 'Editing…',
                    saving: 'Saving…',
                    error: 'Not saved, retrying',
                    saved: this.inDb ? 'Saved' : 'Empty'
                }[this.saveState];
            },
            uploadPercent() {
                if (!this.upload.total) return 0;
                return Math.min(100, Math.round(this.upload.loaded / this.upload.total * 100));
            },
            renderedMarkdown() {
                return DOMPurify.sanitize(marked.parse(this.text));
            },
            images() {
                return this.uploads.filter(u => u.is_image);
            },
            lightboxIndex() {
                return this.images.findIndex(i => i.url === this.lightbox.url);
            },
            lightboxName() {
                const image = this.images[this.lightboxIndex];
                return image ? image.filename : '';
            },
            dragging() {
                return this.dragDepth > 0;
            }
        },
        watch: {
            text() {
                this.$nextTick(this.resizeEditor);
            },
            mode() {
                this.$nextTick(this.resizeEditor);
            },
            theme(value) {
                if (value === 'on') document.documentElement.setAttribute('data-theme', 'dark');
                else if (value === 'off') document.documentElement.setAttribute('data-theme', 'light');
                else document.documentElement.removeAttribute('data-theme');
                storageSet('darkMode', value);
            }
        },
        methods: {
            update() {
                if (this.preventUpdates) return;
                fetch(ITEM_PATH + '?json', {headers: itemHeaders()}).then((response) => {
                    return response.json().then((data) => {
                        if (this.preventUpdates) return;
                        this.dataLoaded = true;
                        if (response.status === 403) {
                            this.locked = true;
                            this.hasPassword = true;
                            this.displayName = data.display_name;
                            this.name = data.display_name;
                            document.title = data.display_name;
                            return;
                        }
                        this.applyServerState(data);
                    });
                }).catch(() => {
                    if (this.saveState === 'saved') this.flashSyncNote('Offline');
                });
            },
            applyServerState(data) {
                if (this.dataLoaded && this.inDb && data.text !== this.text && this.saveState === 'saved') {
                    this.flashSyncNote('Updated from elsewhere');
                }
                this.locked = false;
                this.text = data.text;
                this.mode = data.mode;
                if (!this.editingTitle) this.name = data.name;
                this.displayName = data.display_name;
                this.inDb = data.in_db;
                this.hasPassword = data.has_password;
                this.shortcut = data.shortcut;
                this.shortLinkExpiresAt = data.short_link_expires_at;
                this.passwordToken = data.password_token;
                this.uploads = data.uploads.map((upload) => {
                    if (data.password_token) {
                        upload.url += (upload.url.indexOf('?') === -1 ? '?' : '&') + 't=' + encodeURIComponent(data.password_token);
                    }
                    return upload;
                });
                document.title = data.display_name;
            },
            flashSyncNote(note) {
                this.syncNote = note;
                clearTimeout(this.syncNoteTimeout);
                this.syncNoteTimeout = setTimeout(() => { this.syncNote = ''; }, 2500);
            },
            showToast(text, error) {
                this.toast = {text: text, error: !!error};
                clearTimeout(this.toastTimeout);
                this.toastTimeout = setTimeout(() => { this.toast = {text: '', error: false}; }, 2200);
            },
            save(data) {
                // Edits made while this save is in flight keep polling paused until they're saved too.
                const revision = this.editRevision;
                this.pendingSaves += 1;
                this.preventUpdates = true;
                this.saveState = 'saving';
                // One save at a time: the server writes every field, so overlapping saves lose changes.
                this.saveQueue = (this.saveQueue || Promise.resolve()).catch(() => {}).then(() => postJson(ITEM_PATH, data));
                return this.saveQueue.then((response) => {
                    if (!response.ok) throw new Error('save failed');
                    this.pendingSaves -= 1;
                    if (this.pendingSaves > 0 || revision !== this.editRevision) return;
                    this.saveState = 'saved';
                    this.preventUpdates = false;
                    this.update();
                }).catch(() => {
                    this.pendingSaves -= 1;
                    if (revision !== this.editRevision) return;
                    this.saveState = 'error';
                    clearTimeout(this.changeTimeout);
                    this.changeTimeout = setTimeout(() => this.submitChange(), 3000);
                });
            },
            submitChange() {
                return this.save({text: this.text, mode: this.mode});
            },
            onTextInput() {
                this.editRevision += 1;
                this.preventUpdates = true;
                this.saveState = 'pending';
                clearTimeout(this.changeTimeout);
                this.changeTimeout = setTimeout(() => this.submitChange(), 500);
            },
            setMode(mode) {
                this.mode = mode;
                clearTimeout(this.changeTimeout);
                this.submitChange();
            },
            saveTitle() {
                this.editingTitle = false;
                if (!this.dataLoaded || this.locked) return;
                this.save({name: this.name.trim()});
            },
            resizeEditor() {
                const editor = this.$refs.editor;
                if (!editor) return;
                editor.style.height = 'auto';
                editor.style.height = editor.scrollHeight + 'px';
            },
            copyLink() {
                const url = window.location.protocol + '//' + window.location.host + this.shareUrl;
                navigator.clipboard.writeText(url).then(() => {
                    this.copied = true;
                    setTimeout(() => { this.copied = false; }, 1600);
                }, () => this.showToast('Copy failed. Select the link instead.', true));
            },
            cycleTheme() {
                this.theme = {auto: 'off', off: 'on', on: 'auto'}[this.theme] || 'auto';
            },
            openPasswordDialog() {
                this.$refs.pwDialog.showModal();
            },
            setPassword(password) {
                postJson(ITEM_PATH, {password: password}).then((response) => {
                    if (!response.ok) throw new Error('failed');
                    if (password) storageSet(PASSWORD_KEY, password);
                    else storageRemove(PASSWORD_KEY);
                    this.$refs.pwDialog.close();
                    this.showToast(password ? 'Password set' : 'Password removed');
                    this.update();
                }).catch(() => this.showToast('Password not changed. Try again.', true));
            },
            verifyPassword() {
                fetch(ITEM_PATH + 'verify-password/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN},
                    body: JSON.stringify({password: this.inputPassword})
                }).then((response) => {
                    if (response.ok) {
                        storageSet(PASSWORD_KEY, this.inputPassword);
                        this.inputPassword = '';
                        this.locked = false;
                        this.update();
                    } else {
                        storageRemove(PASSWORD_KEY);
                        this.unlockError = 'That password is incorrect.';
                    }
                });
            },

            // Uploads: generate-upload-params -> POST the file -> register it on the item
            uploadFile(file, onProgress) {
                const formData = new FormData();
                formData.append('filename', file.name);
                return fetch(ITEM_PATH + 'generate-upload-params/', {
                    method: 'POST',
                    headers: itemHeaders(),
                    body: formData
                }).then((response) => {
                    if (!response.ok) throw new Error('Upload refused');
                    return response.json();
                }).then((params) => {
                    const body = new FormData();
                    for (const [key, value] of Object.entries(params.fields)) {
                        body.append(key, value);
                    }
                    body.append('file', file, file.name);
                    return postWithProgress(params.url, body, onProgress).then(() => {
                        return postJson(ITEM_PATH + 'upload/', {
                            key: params.fields.key,
                            url: params.url + '/' + params.fields.key
                        });
                    });
                }).then((response) => {
                    if (!response.ok) throw new Error('Upload not registered');
                    return response.json();
                });
            },
            uploadFiles(files) {
                files = Array.from(files);
                if (!files.length || this.locked) return;
                if (this.upload.active) {
                    this.upload.count += files.length;
                    this.upload.total += files.reduce((sum, f) => sum + f.size, 0);
                    this.uploadQueue.push(...files);
                    return;
                }
                this.uploadQueue = files.slice();
                this.upload = {active: true, count: files.length, done: 0, loaded: 0, total: files.reduce((sum, f) => sum + f.size, 0)};
                let finishedBytes = 0;
                let failed = 0;
                const next = () => {
                    const file = this.uploadQueue.shift();
                    if (!file) {
                        this.upload.active = false;
                        if (failed) this.showToast(failed + (failed === 1 ? ' file' : ' files') + ' failed to upload', true);
                        else this.showToast(this.upload.count === 1 ? 'File uploaded' : this.upload.count + ' files uploaded');
                        this.update();
                        return;
                    }
                    this.uploadFile(file, (loaded) => {
                        this.upload.loaded = finishedBytes + loaded;
                    }).catch(() => { failed += 1; }).then(() => {
                        finishedBytes += file.size;
                        this.upload.loaded = finishedBytes;
                        this.upload.done += 1;
                        this.update();
                        next();
                    });
                };
                next();
            },
            onFilesPicked(event) {
                this.uploadFiles(event.target.files);
                event.target.value = '';
            },
            onDragEnter(event) {
                if (this.locked || !Array.from(event.dataTransfer.types).includes('Files')) return;
                this.dragDepth += 1;
            },
            onDragLeave() {
                if (this.dragDepth > 0) this.dragDepth -= 1;
            },
            onDrop(event) {
                this.dragDepth = 0;
                if (event.dataTransfer.files.length) this.uploadFiles(event.dataTransfer.files);
            },
            handlePaste(event) {
                if (!event.clipboardData.files.length) return;
                event.preventDefault();
                const original = event.clipboardData.files[0];
                const extension = (original.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
                const file = new File([original], 'image_' + Date.now() + '.' + extension, {type: original.type});
                const input = event.target;
                const placeholder = '![uploading ' + file.name + '…]()';
                input.setRangeText(placeholder, input.selectionStart, input.selectionEnd, 'end');
                this.text = input.value;
                this.uploadFile(file, () => {}).then((data) => {
                    let url = data.url;
                    if (this.passwordToken) url += '?t=' + encodeURIComponent(this.passwordToken);
                    this.text = this.text.replace(placeholder, '![](' + url + ')');
                    this.submitChange();
                    this.update();
                }).catch(() => {
                    this.text = this.text.replace(placeholder, '');
                    this.showToast('Image upload failed', true);
                });
            },
            deleteUpload(upload) {
                if (this.confirmDelete !== upload.guid) {
                    this.confirmDelete = upload.guid;
                    clearTimeout(this.confirmDeleteTimeout);
                    this.confirmDeleteTimeout = setTimeout(() => { this.confirmDelete = null; }, 3000);
                    return;
                }
                this.confirmDelete = null;
                if (this.audio.guid === upload.guid) {
                    this.player.pause();
                    this.audio = {guid: null, playing: false, progress: 0};
                }
                this.uploads = this.uploads.filter(u => u.guid !== upload.guid);
                fetch(ITEM_PATH + 'upload/' + upload.guid + '/delete/', {
                    method: 'POST',
                    headers: itemHeaders()
                }).then((response) => {
                    if (!response.ok) throw new Error('failed');
                    this.showToast('File deleted');
                }).catch(() => {
                    this.showToast('Delete failed', true);
                    this.update();
                });
            },

            // Calculator: typing "=" after an expression appends its result
            handleKeyup(event) {
                const input = event.target;
                const pos = input.selectionStart;
                if (input.value[pos - 1] !== '=' || event.key !== '=') return;
                const lineStart = input.value.lastIndexOf('\n', pos - 2) + 1;
                const expression = input.value.substring(lineStart, pos - 1);
                let result;
                try {
                    result = exprEval.Parser.parse(expression).evaluate();
                } catch (e) {
                    return;
                }
                if (typeof result !== 'number' || !isFinite(result)) return;
                result = parseFloat(result.toPrecision(12));
                input.setRangeText(' ' + result, pos, input.selectionEnd, 'end');
                this.text = input.value;
                this.onTextInput();
            },

            // Lightbox
            openLightbox(url) {
                this.lightbox = {open: true, url: url, zoomed: false};
                this.$nextTick(() => this.$refs.lightbox.showModal());
            },
            stepLightbox(step) {
                if (this.images.length < 2 || this.lightboxIndex === -1) return;
                const index = (this.lightboxIndex + step + this.images.length) % this.images.length;
                this.lightbox.url = this.images[index].url;
                this.lightbox.zoomed = false;
            },
            onPreviewClick(event) {
                if (event.target.tagName !== 'IMG') return;
                const src = event.target.getAttribute('src');
                const absolute = event.target.src;
                const match = this.images.find(i => i.url === src || i.url === absolute || absolute.endsWith(i.url));
                this.openLightbox(match ? match.url : src);
            },

            // Audio: one shared player that continues to the next audio file
            toggleAudio(upload) {
                if (this.audio.guid === upload.guid) {
                    if (this.player.paused) this.playAudio();
                    else this.player.pause();
                    return;
                }
                this.audio = {guid: upload.guid, playing: false, progress: 0};
                this.player.src = upload.url;
                this.playAudio();
            },
            playAudio() {
                this.player.play().catch(() => {
                    this.audio = {guid: null, playing: false, progress: 0};
                    this.showToast("Can't play this file", true);
                });
            },
            playNextAudio() {
                const tracks = this.uploads.filter(u => u.is_audio);
                const index = tracks.findIndex(u => u.guid === this.audio.guid);
                if (index !== -1 && index + 1 < tracks.length) this.toggleAudio(tracks[index + 1]);
                else this.audio.playing = false;
            },

            extension(filename) {
                const dot = filename.lastIndexOf('.');
                return dot === -1 ? 'FILE' : filename.slice(dot + 1, dot + 6).toUpperCase();
            },
            formatDate(value) {
                return value ? new Date(value).toLocaleString() : '';
            },
            relativeTime(value) {
                const seconds = Math.max(0, (this.clock - new Date(value).getTime()) / 1000);
                if (seconds < 60) return 'now';
                if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
                if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
                return Math.floor(seconds / 86400) + 'd';
            }
        }
    });

    app.mount('#app');
</script>
</body>
</html>
