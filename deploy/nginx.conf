# /etc/nginx/sites-enabled/shortterm.store
# Certificate (certbot, webroot): --cert-name shortterm.store -d shortterm.store -d new.shortterm.store

server {
    listen 80;
    listen [::]:80;
    server_name shortterm.store new.shortterm.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shortterm.store new.shortterm.store;

    ssl_certificate /etc/letsencrypt/live/shortterm.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shortterm.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5G;
    # The default body temp dir is on the small root disk.
    client_body_temp_path /mnt/volume-ams3-01/shortterm_store/nginx_body;

    # Files authorized by Django via X-Accel-Redirect.
    location /_protected/ {
        internal;
        alias /mnt/volume-ams3-01/shortterm_store/storage/;
        # Uploaded files are user content: never sniff types, never run script.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
